[package]
name = "suprnova-markdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Markdown twins of an app's prose pages, for AI agents and crawlers that don't run JavaScript"
license = "MIT"

[dependencies]
suprnova = { git = "https://github.com/eas4ai/suprnova.git", rev = "3229aa9af542c991196274fa3c235cdce88a68e2" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
