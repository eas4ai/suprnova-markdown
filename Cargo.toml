[package]
name = "suprnova-markdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Markdown twins of an app's prose pages, for AI agents and crawlers that don't run JavaScript"
license = "MIT"

[dependencies]
suprnova = { git = "https://github.com/entrepeneur4lyf/suprnova", tag = "v0.9.1" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
